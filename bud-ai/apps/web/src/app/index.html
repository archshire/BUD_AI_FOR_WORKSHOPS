<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SUTD Academy Learning Spaces</title>
    <link rel="stylesheet" href="/participant.css?v=5">
  </head>
  <body class="participant-landing">
    <main class="landing-shell">
      <div class="academy-brand">
        <img class="sutd-logo" src="/assets/SA.png" alt="SUTD Academy">
        <p class="kicker">SUTD Academy<br>Learning Spaces</p>
      </div>
      <section class="welcome-panel" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Welcome to SUTD Academy</h1>
        <p class="welcome-copy">Collaborative AI-powered workshops for tomorrow's world</p>
        <div class="access-card">
          <div class="access-tabs" role="tablist" aria-label="Participant access">
            <button class="access-tab is-active" id="registered-tab" type="button" role="tab" aria-selected="true">Registered learner</button>
            <button class="access-tab" id="guest-tab" type="button" role="tab" aria-selected="false">Join as guest</button>
          </div>
          <form id="access-form" class="access-form">
            <div id="registered-fields">
              <label for="registered-name-input">Name</label>
              <input id="registered-name-input" autocomplete="name" placeholder="Your name">
              <label for="email-input">Email</label>
              <input id="email-input" type="email" autocomplete="email" placeholder="you@example.com">
              <label for="password-input">Password</label>
              <input id="password-input" type="password" autocomplete="current-password" placeholder="Your password">
            </div>
            <div id="guest-fields" hidden>
              <label for="guest-name-input">Name</label>
              <input id="guest-name-input" placeholder="Your display name">
            </div>
            <label for="workshop-code-input">Workshop code</label>
            <input id="workshop-code-input" required placeholder="e.g. BUD-101">
            <button class="primary-button" type="submit">Enter learning space</button>
            <p class="access-status" id="access-status" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="/participant.js?v=6"></script>
  </body>
</html>
