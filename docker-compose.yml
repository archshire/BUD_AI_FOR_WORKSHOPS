services:
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    ports:
      - "${LIVEKIT_DIRECT_PORT:-7883}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  gateway:
    image: caddy:2-alpine
    depends_on:
      - bud
      - livekit
    environment:
      LAN_HOST: ${LAN_HOST:-10.12.7.1}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${LIVEKIT_PORT:-7880}:7880"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_MOUNT:-caddy-data}:/data
      - caddy-config:/config

  whisper:
    build:
      context: ./bud-ai/apps/stt
    environment:
      STT_HOST: 0.0.0.0
      STT_PORT: 8787
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-2}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-8}
      HF_HOME: /models/huggingface
    volumes:
      - whisper-models:/models

  translation:
    build:
      context: ./bud-ai/apps/translation
    environment:
      TRANSLATION_HOST: 0.0.0.0
      TRANSLATION_PORT: 8788
      NLLB_MODEL_DIR: /models/nllb
      HF_HOME: /models/huggingface
    volumes:
      - nllb-models:/models

  qwen:
    build:
      context: ./bud-ai/apps/llm
    environment:
      LLM_HOST: 0.0.0.0
      LLM_PORT: 8790
      LLM_THREADS: ${LLM_THREADS:-12}
      QWEN_MODEL_DIR: /models/qwen
      QWEN_MODEL_PATH: /models/qwen/${QWEN_MODEL_FILE:-Qwen3-1.7B.Q4_K_M.gguf}
      # Keep filename, source, and container path together here. The pinned URL
      # makes clean model-volume downloads reproducible across rebuilds.
      QWEN_MODEL_URL: ${QWEN_MODEL_URL:-https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/cc27747d7419139e44ba97777c2f2fd5dca92ee1/Qwen3-1.7B-Q4_K_M.gguf?download=true}
    volumes:
      # Mount at /models, matching the image-level volume declaration. A
      # narrower /models/qwen bind would be masked by that declared volume.
      - ${QWEN_MODEL_MOUNT:-qwen-models}:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8790/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

  bud:
    build:
      context: ./bud-ai
    depends_on:
      - livekit
      - whisper
      - translation
      - qwen
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_SERVER_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:7883}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STT_HOST: whisper
      STT_PORT: 8787
      TRANSLATION_HOST: translation
      TRANSLATION_PORT: 8788
      LLM_HOST: qwen
      LLM_PORT: 8790
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-chat-latest}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHECKIN_WORD_INTERVAL: ${CHECKIN_WORD_INTERVAL:-500}
      SOURCE_PACK_ROOT: /app/data/source-packs
      BUD_STATE_FILE: /app/data/source-packs/workshop-state.json
      BUD_MEMORY_ROOT: /app/data/source-packs/bud-memory
      BUD_LEDGER_ROOT: /app/data/source-packs/contextual-memory
    ports:
      - "${BUD_PORT:-3002}:3002"
    volumes:
      - ${SOURCE_PACK_MOUNT:-source-packs}:/app/data/source-packs

volumes:
  whisper-models:
  nllb-models:
  qwen-models:
  source-packs:
  caddy-data:
  caddy-config:
